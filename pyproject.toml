[build-system]
requires = ["setuptools>=77.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_optimizer"
authors = [
    {name = "Mansi Sakarvadia", email = "sakarvadia@uchicago.com"},
]
description = "Foobar example package"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "requests",
    "openai",
    "detoxify",
    "pandas",
    "openevolve",
    "gepa",
    "litellm",
    "kernelbench",
    "sentence-transformers",
    "google-genai",
    "tilelang",
    "triton",
    "nvidia-cutlass-dsl",
    "vllm",
    "huggingface_hub",
    "lm-eval",
    "accelerate",
    "wonderwords",
    "nltk",
    "jieba",
    "fuzzywuzzy",
    "rouge", # noqa
    "ray",
    "colorama",
    "ConfigArgParse",
    "filelock",
    "numpy",
    "PyYAML",
    "wandb",
    "networkx",
]

[project.urls]
Homepage = "https://github.com/sakarvadia/llm_optimizer"
Documentation = "https://foobar.readthedocs.io"
Source = "https://github.com/sakarvadia/llm_optimizer"

[project.optional-dependencies]
dev = [
    "covdefaults>=2.2",
    "coverage",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff>=0.2.0",
    "tox",
    "virtualenv",
]

notebooks = [
    "jupyter",
    "ipykernel",
]

docs = [
    "black==24.4.2",
    "mkdocs-autorefs==1.3.1",
    "mkdocs-click==0.8.1",
    "mkdocs-gen-files==0.5.0",
    "mkdocs-literate-nav==0.6.1",
    "mkdocs-material==9.5.32",
    "mkdocs-section-index==0.3.9",
    "mkdocstrings==0.25.2",
    "mkdocstrings-python==1.10.8",
    "mike==2.1.3",
]

gpu = [
    "kernelbench[gpu]"
]

[tool.codespell]
skip = """
.git,
.github,
__pycache__,
build,
dist,
.*egg-info,
pyproject.toml,
uv.lock,
"""

[tool.coverage.run]
plugins = ["covdefaults"]
omit = ["examples"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff.lint]
# See all rules here: https://beta.ruff.rs/docs/rules
select = [
    # pyflakes
    "F",
    # pycodestyle
    "E",
    # mccabe
    "C90",
    # isort
    "I",
    # pep8-naming
    "N",
    # pydocstyle
    "D",
    # pyupgrade
    "UP",
    # flake8-2020
    "YTT",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-commas
    "COM",
    # flake8-comprehensions
    "C4",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-pytest-style
    "PT",
    # flake8-quotes
    "Q",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # PyLint
    "PL",
    # ruff-specific
    "RUF",
]
extend-ignore = []

[tool.ruff.lint.flake8-pytest-style]
parametrize-values-type = "tuple"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["foobar", "test", "testing"]
order-by-type = false
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"*/*_test.py" = ["D10"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.packages.find]
exclude = ["tests*", "testing*"]
namespaces = false

[tool.setuptools_scm]

[tool.uv.sources]
kernelbench = { path = "./KernelBench", editable = true }

[[tool.mypy.overrides]]
module = "llm_optimizer.tasks.traveling_salesman"
ignore_errors = true

[[tool.mypy.overrides]]
module = "llm_optimizer.tasks.cant_be_late_utils.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "llm_optimizer.tasks.cloudcast_utils.*"
ignore_errors = true
